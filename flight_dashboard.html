<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyMarshal - Etihad Airways Recovery Dashboard</title>
    <style>
        :root {
            --etihad-gold: #BD8B13;
            --etihad-gold-light: #D4A84B;
            --etihad-bronze: #8B6914;
            --etihad-dark: #1A1A2E;
            --etihad-navy: #16213E;
            --etihad-slate: #0F3460;
            --etihad-white: #FFFFFF;
            --etihad-cream: #F5F0E6;
            --success: #4CAF50;
            --warning: #FF9800;
            --danger: #F44336;
            --info: #2196F3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Arial', sans-serif; background: linear-gradient(135deg, var(--etihad-dark) 0%, var(--etihad-navy) 100%); color: var(--etihad-cream); min-height: 100vh; }
        
        .header { background: linear-gradient(90deg, var(--etihad-dark), var(--etihad-navy)); padding: 15px 25px; border-bottom: 3px solid var(--etihad-gold); display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon { font-size: 32px; }
        .logo h1 { font-size: 24px; color: var(--etihad-gold); font-weight: 300; letter-spacing: 2px; }
        .logo h1 span { font-weight: 600; }
        
        .filters { display: flex; gap: 15px; align-items: center; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 10px; color: var(--etihad-gold-light); text-transform: uppercase; letter-spacing: 1px; }
        .filter-group select { padding: 10px 15px; border-radius: 4px; border: 1px solid var(--etihad-gold); background: var(--etihad-navy); color: var(--etihad-cream); min-width: 220px; font-size: 13px; }
        .filter-group select:focus { outline: none; border-color: var(--etihad-gold-light); }
        .btn { padding: 10px 25px; background: linear-gradient(135deg, var(--etihad-gold), var(--etihad-bronze)); color: var(--etihad-dark); border: none; border-radius: 4px; cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
        .btn:hover { background: linear-gradient(135deg, var(--etihad-gold-light), var(--etihad-gold)); }
        
        .nav-tabs { display: flex; background: var(--etihad-navy); border-bottom: 1px solid rgba(189,139,19,0.3); overflow-x: auto; }
        .nav-tab { padding: 15px 25px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; font-size: 13px; color: var(--etihad-cream); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .nav-tab:hover { background: rgba(189,139,19,0.1); color: var(--etihad-gold); }
        .nav-tab.active { border-bottom-color: var(--etihad-gold); color: var(--etihad-gold); background: rgba(189,139,19,0.15); }
        .nav-tab .icon { font-size: 16px; }
        
        .main { padding: 20px; display: grid; grid-template-columns: 340px 1fr; gap: 20px; min-height: calc(100vh - 140px); }
        
        .flight-summary { background: linear-gradient(135deg, var(--etihad-navy), var(--etihad-slate)); border-radius: 8px; padding: 20px; border: 1px solid rgba(189,139,19,0.3); }
        .flight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(189,139,19,0.3); }
        .flight-number { font-size: 28px; font-weight: 300; color: var(--etihad-gold); letter-spacing: 2px; }
        .status-badge { padding: 6px 15px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .status-delayed { background: rgba(255,152,0,0.2); color: var(--warning); border: 1px solid var(--warning); }
        .status-cancelled { background: rgba(244,67,54,0.2); color: var(--danger); border: 1px solid var(--danger); }
        .status-ontime { background: rgba(76,175,80,0.2); color: var(--success); border: 1px solid var(--success); }
        
        .route-display { display: flex; align-items: center; gap: 15px; margin: 20px 0; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .airport { text-align: center; min-width: 60px; }
        .airport-code { font-size: 24px; font-weight: 600; color: var(--etihad-gold); }
        .airport-time { font-size: 12px; color: var(--etihad-cream); opacity: 0.8; margin-top: 4px; }
        .route-line { flex: 1; height: 2px; background: linear-gradient(90deg, var(--etihad-gold), var(--etihad-gold-light), var(--etihad-gold)); position: relative; }
        .route-line::after { content: "✈"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); color: var(--etihad-gold); font-size: 20px; }
        
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(189,139,19,0.15); font-size: 13px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--etihad-gold-light); }
        .info-value { font-weight: 500; color: var(--etihad-cream); }
        
        .agent-content { display: none; background: linear-gradient(135deg, var(--etihad-navy), var(--etihad-slate)); border-radius: 8px; padding: 20px; border: 1px solid rgba(189,139,19,0.3); }
        .agent-content.active { display: block; }
        
        .section-title { font-size: 18px; color: var(--etihad-gold); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--etihad-gold); font-weight: 300; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 15px; border: 1px solid rgba(189,139,19,0.2); transition: all 0.3s; }
        .card:hover { border-color: var(--etihad-gold); transform: translateY(-2px); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-weight: 500; color: var(--etihad-gold); font-size: 14px; }
        .card-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card-row:last-child { border-bottom: none; }
        .card-label { color: rgba(245,240,230,0.7); }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .kpi-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 20px; text-align: center; border: 1px solid rgba(189,139,19,0.2); }
        .kpi-value { font-size: 32px; font-weight: 300; color: var(--etihad-gold); }
        .kpi-label { font-size: 11px; color: var(--etihad-cream); margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        
        .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 10px; margin: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag-warning { background: rgba(255,152,0,0.2); color: var(--warning); }
        .tag-danger { background: rgba(244,67,54,0.2); color: var(--danger); }
        .tag-success { background: rgba(76,175,80,0.2); color: var(--success); }
        .tag-info { background: rgba(33,150,243,0.2); color: var(--info); }
        .tag-gold { background: rgba(189,139,19,0.2); color: var(--etihad-gold); }
        
        .pax-list { max-height: 450px; overflow-y: auto; }
        .pax-list::-webkit-scrollbar { width: 6px; }
        .pax-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .pax-list::-webkit-scrollbar-thumb { background: var(--etihad-gold); border-radius: 3px; }
        .pax-item { padding: 12px 15px; border-bottom: 1px solid rgba(189,139,19,0.1); cursor: pointer; transition: all 0.2s; }
        .pax-item:hover { background: rgba(189,139,19,0.1); }
        .pax-item.selected { background: rgba(189,139,19,0.2); border-left: 3px solid var(--etihad-gold); }
        .pax-name { font-weight: 500; color: var(--etihad-cream); }
        .pax-details { font-size: 11px; color: rgba(245,240,230,0.6); margin-top: 4px; }
        
        .detail-panel { margin-top: 15px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--etihad-gold); }
        
        .timeline { margin-top: 20px; }
        .timeline-item { display: flex; gap: 15px; padding: 15px 0; border-left: 2px solid var(--etihad-gold); margin-left: 10px; padding-left: 20px; position: relative; }
        .timeline-item::before { content: ""; width: 12px; height: 12px; background: var(--etihad-gold); border-radius: 50%; position: absolute; left: -7px; top: 18px; }
        .timeline-time { font-size: 11px; color: var(--etihad-gold-light); min-width: 90px; text-transform: uppercase; }
        .timeline-content { flex: 1; }
        .timeline-action { font-weight: 500; font-size: 13px; color: var(--etihad-cream); }
        .timeline-detail { font-size: 12px; color: rgba(245,240,230,0.6); margin-top: 4px; }
        
        .empty-state { text-align: center; color: var(--etihad-gold-light); padding: 50px; font-size: 14px; }
        
        .weather-card { background: linear-gradient(135deg, rgba(33,150,243,0.1), rgba(0,0,0,0.2)); }
        .weather-time { font-size: 10px; color: var(--info); margin-top: 4px; }
        
        .financial-highlight { background: linear-gradient(135deg, rgba(189,139,19,0.1), rgba(0,0,0,0.2)); border-color: var(--etihad-gold); }
        
        @media (max-width: 1024px) { .main { grid-template-columns: 1fr; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div class="header">
    <div class="logo">
        <span class="logo-icon">✈️</span>
        <h1><span>ETIHAD</span> SkyMarshal</h1>
    </div>
    <div class="filters">
        <div class="filter-group">
            <label>📅 Select Date</label>
            <select id="dateSelect" onchange="populateFlights()"></select>
        </div>
        <div class="filter-group">
            <label>🛫 Select Flight</label>
            <select id="flightSelect"></select>
        </div>
        <button class="btn" onclick="loadFlight()">Load Flight</button>
    </div>
</div>
<div class="nav-tabs">
    <div class="nav-tab active" data-tab="overview"><span class="icon">📊</span>Overview</div>
    <div class="nav-tab" data-tab="passengers"><span class="icon">👥</span>Passengers</div>
    <div class="nav-tab" data-tab="crew"><span class="icon">👨‍✈️</span>Crew</div>
    <div class="nav-tab" data-tab="maintenance"><span class="icon">🔧</span>Maintenance</div>
    <div class="nav-tab" data-tab="cargo"><span class="icon">📦</span>Cargo</div>
    <div class="nav-tab" data-tab="financial"><span class="icon">💰</span>Financial</div>
    <div class="nav-tab" data-tab="recovery"><span class="icon">🔄</span>Recovery</div>
</div>
<div class="main">
    <div class="flight-summary" id="flightSummary">
        <div class="empty-state">✈️ Select a date and flight to view details</div>
    </div>
    <div id="agentContents">
        <div class="agent-content active" id="content-overview"><div class="empty-state">Select a flight to view dashboard</div></div>
        <div class="agent-content" id="content-passengers"></div>
        <div class="agent-content" id="content-crew"></div>
        <div class="agent-content" id="content-maintenance"></div>
        <div class="agent-content" id="content-cargo"></div>
        <div class="agent-content" id="content-financial"></div>
        <div class="agent-content" id="content-recovery"></div>
    </div>
</div>
<script src="data.js"></script>
</body>
</html>
<script>
let currentFlight = null;
let flightData = {};

function getFlights() { return DASHBOARD_DATA.flights_enriched_scenarios || DASHBOARD_DATA.flights_scenarios || []; }
function getPassengers() { return DASHBOARD_DATA.passengers_enriched_final || DASHBOARD_DATA.passengers || []; }

document.addEventListener('DOMContentLoaded', () => {
    initTabs();
    populateDates();
});

function initTabs() {
    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.agent-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('content-' + tab.dataset.tab).classList.add('active');
        });
    });
}

function populateDates() {
    const flights = getFlights();
    const dates = [...new Set(flights.map(f => f.scheduled_departure.split(' ')[0]))].sort();
    const sel = document.getElementById('dateSelect');
    sel.innerHTML = '<option value="">-- Select Date --</option>' + dates.map(d => 
        `<option value="${d}">${new Date(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}</option>`
    ).join('');
}

function populateFlights() {
    const date = document.getElementById('dateSelect').value;
    const sel = document.getElementById('flightSelect');
    if (!date) { sel.innerHTML = '<option value="">-- Select Flight --</option>'; return; }
    
    const flights = getFlights().filter(f => f.scheduled_departure.startsWith(date))
        .sort((a,b) => a.scheduled_departure.localeCompare(b.scheduled_departure));
    
    sel.innerHTML = '<option value="">-- Select Flight --</option>' + flights.map(f => {
        const time = f.scheduled_departure.split(' ')[1].substring(0,5);
        const icon = f.is_cancelled === 'Y' ? '❌' : f.is_disrupted === 'Y' ? '⚠️' : '✅';
        return `<option value="${f.flight_id}">${icon} ${f.flight_number} | ${f.origin_code} → ${f.destination_code} | ${time}</option>`;
    }).join('');
}

function loadFlight() {
    const flightId = document.getElementById('flightSelect').value;
    if (!flightId) { alert('Please select a flight'); return; }
    
    currentFlight = getFlights().find(f => f.flight_id === flightId);
    if (!currentFlight) return;
    
    flightData = {
        flight: currentFlight,
        passengers: getPassengers().filter(p => p.flight_id === flightId),
        bookings: (DASHBOARD_DATA.bookings || []).filter(b => b.flight_id === flightId),
        crew: (DASHBOARD_DATA.crew_roster_enriched || []).filter(c => c.flight_id === flightId || c.flight_number === currentFlight.flight_number),
        cargo: (DASHBOARD_DATA.cargo_shipments || []).filter(c => c.flight_id === flightId || c.flight_number === currentFlight.flight_number),
        maintenance: (DASHBOARD_DATA.aircraft_maintenance_workorders || []).filter(m => m.aircraft_registration === currentFlight.aircraft_registration),
        aircraft: (DASHBOARD_DATA.aircraft_availability_enriched_mel || []).find(a => a.aircraft_registration === currentFlight.aircraft_registration),
        weather: (DASHBOARD_DATA.weather || []).filter(w => w.scenario_id == currentFlight.scenario_id),
        disruptions: (DASHBOARD_DATA.disruption_events || []).filter(d => d.scenario_id == currentFlight.scenario_id),
        recovery: (DASHBOARD_DATA.recovery_scenarios || []).filter(r => r.scenario_id == currentFlight.scenario_id),
        rebooking: (DASHBOARD_DATA.oal_rebooking_options || []).filter(r => r.flight_id === flightId),
        costs: (DASHBOARD_DATA.disruption_costs || []).filter(c => c.scenario_id == currentFlight.scenario_id),
        financial: (DASHBOARD_DATA.financial_transactions || []).filter(t => t.flight_id === flightId || t.scenario_id == currentFlight.scenario_id),
        financialImpact: (DASHBOARD_DATA.financial_impact || []).filter(i => i.scenario_id == currentFlight.scenario_id),
        swapOptions: (DASHBOARD_DATA.aircraft_swap_options || []).filter(s => s.flight_id === flightId),
        reserveCrew: (DASHBOARD_DATA.reserve_crew_pool || []).filter(r => r.scenario_id == currentFlight.scenario_id)
    };
    
    renderFlightSummary();
    renderOverview();
    renderPassengers();
    renderCrew();
    renderMaintenance();
    renderCargo();
    renderFinancial();
    renderRecovery();
}

function renderFlightSummary() {
    const f = currentFlight;
    const statusClass = f.is_cancelled === 'Y' ? 'status-cancelled' : f.is_disrupted === 'Y' ? 'status-delayed' : 'status-ontime';
    const statusText = f.is_cancelled === 'Y' ? 'Cancelled' : f.is_disrupted === 'Y' ? 'Disrupted' : 'On-Time';
    const depTime = f.scheduled_departure.split(' ')[1].substring(0,5);
    const arrTime = f.scheduled_arrival.split(' ')[1].substring(0,5);
    
    document.getElementById('flightSummary').innerHTML = `
        <div class="flight-header">
            <span class="flight-number">${f.flight_number}</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
        <div class="route-display">
            <div class="airport"><div class="airport-code">${f.origin_code}</div><div class="airport-time">${depTime}</div></div>
            <div class="route-line"></div>
            <div class="airport"><div class="airport-code">${f.destination_code}</div><div class="airport-time">${arrTime}</div></div>
        </div>
        <div class="info-row"><span class="info-label">✈️ Aircraft</span><span class="info-value">${f.aircraft_registration} (${f.aircraft_code})</span></div>
        <div class="info-row"><span class="info-label">🚪 Gate / Terminal</span><span class="info-value">${f.gate} / T${f.terminal}</span></div>
        <div class="info-row"><span class="info-label">⏱️ Delay</span><span class="info-value">${f.delay_minutes || 0} minutes</span></div>
        <div class="info-row"><span class="info-label">⚠️ Disrupted</span><span class="info-value"><span class="tag ${f.is_disrupted === 'Y' ? 'tag-warning' : 'tag-success'}">${f.is_disrupted}</span></span></div>
        <div class="info-row"><span class="info-label">❌ Cancelled</span><span class="info-value"><span class="tag ${f.is_cancelled === 'Y' ? 'tag-danger' : 'tag-success'}">${f.is_cancelled}</span></span></div>
        <div class="info-row"><span class="info-label">📋 Scenario</span><span class="info-value" style="font-size:11px;">${f.scenario_name}</span></div>
        ${f.disruption_reason ? `<div style="margin-top:15px;padding:12px;background:rgba(255,152,0,0.1);border-radius:6px;border-left:3px solid var(--warning);">
            <div style="color:var(--warning);font-weight:500;font-size:12px;">⚠️ Disruption Reason</div>
            <div style="color:var(--etihad-cream);margin-top:6px;font-size:12px;">${f.disruption_reason}</div>
        </div>` : ''}
        ${f.mel_status === 'ACTIVE' ? `<div style="margin-top:12px;padding:12px;background:rgba(255,152,0,0.1);border-radius:6px;border-left:3px solid var(--warning);">
            <div style="color:var(--warning);font-weight:500;font-size:12px;">🔧 MEL Active: ${f.mel_item}</div>
            <div style="color:var(--etihad-cream);margin-top:6px;font-size:11px;">Category ${f.mel_category} | ${f.mel_days_remaining} days remaining</div>
        </div>` : ''}
    `;
}

function renderOverview() {
    const f = currentFlight;
    const paxCount = flightData.passengers.length;
    const disruptedPax = flightData.passengers.filter(p => p.is_disrupted === 'Y').length;
    const crewCount = flightData.crew.length;
    const cargoCount = flightData.cargo.length;
    
    // Calculate financial totals
    const totalRevenue = flightData.financial.reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
    const totalCosts = flightData.costs.reduce((sum, c) => sum + (parseFloat(c.total_cost) || 0), 0);
    
    document.getElementById('content-overview').innerHTML = `
        <div class="section-title">📊 Flight Overview - ${f.flight_number}</div>
        <div class="kpi-grid">
            <div class="kpi-box"><div class="kpi-value">${paxCount}</div><div class="kpi-label">👥 Passengers</div></div>
            <div class="kpi-box"><div class="kpi-value" style="color:var(--warning)">${disruptedPax}</div><div class="kpi-label">⚠️ Disrupted</div></div>
            <div class="kpi-box"><div class="kpi-value">${crewCount}</div><div class="kpi-label">👨‍✈️ Crew</div></div>
            <div class="kpi-box"><div class="kpi-value">$${Math.round(totalCosts).toLocaleString()}</div><div class="kpi-label">💰 Est. Cost</div></div>
        </div>
        <div class="card-grid">
            <div class="card">
                <div class="card-header"><span class="card-title">✈️ Flight Status</span></div>
                <div class="card-row"><span class="card-label">Is Disrupted</span><span class="tag ${f.is_disrupted === 'Y' ? 'tag-warning' : 'tag-success'}">${f.is_disrupted}</span></div>
                <div class="card-row"><span class="card-label">Is Cancelled</span><span class="tag ${f.is_cancelled === 'Y' ? 'tag-danger' : 'tag-success'}">${f.is_cancelled}</span></div>
                <div class="card-row"><span class="card-label">Delay Minutes</span><span>${f.delay_minutes || 0}</span></div>
                <div class="card-row"><span class="card-label">Primary Disruption</span><span class="tag ${f.is_primary_disruption === 'Y' ? 'tag-danger' : 'tag-info'}">${f.is_primary_disruption}</span></div>
            </div>
            ${flightData.weather.length > 0 ? `<div class="card weather-card">
                <div class="card-header"><span class="card-title">🌤️ Weather Conditions</span></div>
                ${flightData.weather.filter(w => w.airport_code === f.origin_code || w.airport_code === f.destination_code).slice(0,4).map(w => {
                    const obsTime = w.observation_time ? new Date(w.observation_time).toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: false}) : 'N/A';
                    return `<div class="card-row">
                        <span class="card-label">${w.airport_code}</span>
                        <span>
                            ${w.condition || 'N/A'}
                            <div class="weather-time">⏰ ${obsTime} | ${w.temperature_c || '--'}°C | 💨 ${w.wind_speed_kts || '--'}kts</div>
                        </span>
                    </div>`;
                }).join('')}
            </div>` : ''}
            ${flightData.disruptions.length > 0 ? `<div class="card">
                <div class="card-header"><span class="card-title">⚠️ Disruption Events</span></div>
                ${flightData.disruptions.slice(0,3).map(d => `<div class="card-row"><span class="card-label">${d.disruption_type || 'Event'}</span><span style="font-size:11px;">${d.description || d.disruption_reason || 'N/A'}</span></div>`).join('')}
            </div>` : ''}
            <div class="card">
                <div class="card-header"><span class="card-title">📦 Cargo Summary</span></div>
                <div class="card-row"><span class="card-label">Total Shipments</span><span>${cargoCount}</span></div>
                <div class="card-row"><span class="card-label">Total Weight</span><span>${flightData.cargo.reduce((s,c) => s + (parseFloat(c.weight)||0), 0).toFixed(0)} kg</span></div>

<script>

                        const statusClass = p.is_cancelled === 'Y' ? 'tag-danger' : p.is_disrupted === 'Y' ? 'tag-warning' : 'tag-success';
                        const statusText = p.is_cancelled === 'Y' ? 'Cancelled' : p.is_disrupted === 'Y' ? 'Disrupted' : 'OK';
                        return `<div class="pax-item" onclick="showPaxDetail('${p.passenger_id}')">

                            <div class="pax-details">🎫 ${p.pnr || 'N/A'} | 💺 ${p.original_cabin_class || 'Economy'}</div>
                            ${p.is_vip == 1 ? '<span class="tag tag-gold">👑 VIP</span>' : ''}
                            ${p.frequent_flyer_tier_id ? '<span class="tag tag-gold">✨ FFP</span>' : ''}

function showPaxDetail(passengerId) {
    const p = flightData.passengers.find(px => px.passenger_id === passengerId);
    if (!p) return;
    
    document.querySelectorAll('.pax-item').forEach(el => el.classList.remove('selected'));
    if (event && event.currentTarget) event.currentTarget.classList.add('selected');
    
    const timeline = buildTimeline(p);
    
    document.getElementById('paxDetail').innerHTML = `
        <div style="font-size:18px;font-weight:300;color:var(--etihad-gold);margin-bottom:15px;letter-spacing:1px;">👤 ${p.first_name} ${p.last_name}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;">
            <div class="card-row"><span class="card-label">🆔 Passenger ID</span><span>${p.passenger_id}</span></div>
            <div class="card-row"><span class="card-label">🎫 PNR</span><span>${p.pnr || 'N/A'}</span></div>
            <div class="card-row"><span class="card-label">⚠️ Disrupted</span><span class="tag ${p.is_disrupted === 'Y' ? 'tag-warning' : 'tag-success'}">${p.is_disrupted}</span></div>
            <div class="card-row"><span class="card-label">❌ Cancelled</span><span class="tag ${p.is_cancelled === 'Y' ? 'tag-danger' : 'tag-success'}">${p.is_cancelled}</span></div>
            <div class="card-row"><span class="card-label">💺 Class</span><span>${p.original_cabin_class || 'Economy'}</span></div>
            <div class="card-row"><span class="card-label">🌍 Nationality</span><span>${p.nationality || 'N/A'}</span></div>
            <div class="card-row"><span class="card-label">📧 Email</span><span style="font-size:10px;">${p.email || 'N/A'}</span></div>

        </div>
        ${p.disruption_reason ? `<div style="margin-top:15px;padding:12px;background:rgba(255,152,0,0.1);border-radius:6px;border-left:3px solid var(--warning);">
            <div style="color:var(--warning);font-weight:500;font-size:12px;">⚠️ Disruption Reason</div>
            <div style="color:var(--etihad-cream);margin-top:6px;font-size:12px;">${p.disruption_reason}</div>
        </div>` : ''}
        <div class="timeline" style="margin-top:20px;">
            <h4 style="color:var(--etihad-gold);margin-bottom:12px;font-size:14px;">📍 Recovery Timeline</h4>
            ${timeline}
        </div>
    `;
}

function buildTimeline(p) {
    const events = [];
    const f = currentFlight;
    
    events.push({ time: '🎫 Booked', action: 'Original Booking', detail: `${f.flight_number}: ${f.origin_code} → ${f.destination_code}` });
    
    if (p.is_disrupted === 'Y') {
        events.push({ time: '⚠️ Disrupted', action: 'Flight Disrupted', detail: p.disruption_reason || f.disruption_reason || 'Operational issue' });
    }
    
    if (p.is_cancelled === 'Y') {
        events.push({ time: '❌ Cancelled', action: 'Flight Cancelled', detail: 'Flight has been cancelled' });
    }
    
    if (p.rebook_status && p.rebook_status !== '') {
        events.push({ time: '🔄 Rebooking', action: p.rebook_status, detail: p.rebook_flight_number ? `New flight: ${p.rebook_flight_number}` : 'Processing options' });
    }
    
    if (p.compensation_offered === 'Y' || p.compensation_amount_usd > 0) {
        events.push({ time: '💰 Compensation', action: 'Compensation Offered', detail: p.compensation_amount_usd ? `$${p.compensation_amount_usd}` : 'Voucher issued' });
    }
    
    if (p.hotel_provided === 'Y') {
        events.push({ time: '🏨 Hotel', action: 'Hotel Provided', detail: 'Accommodation arranged' });
    }
    
    if (p.meal_voucher_provided === 'Y') {
        events.push({ time: '🍽️ Meals', action: 'Meal Voucher', detail: 'Meal voucher provided' });
    }
    
    const status = p.rebook_status === 'CONFIRMED' ? 'Successfully rebooked' : (p.is_disrupted === 'Y' ? 'Awaiting resolution' : 'Ready for departure');
    events.push({ time: '📍 Current', action: 'Status', detail: status });
    
    return events.map(e => `
        <div class="timeline-item">
            <div class="timeline-time">${e.time}</div>
            <div class="timeline-content">
                <div class="timeline-action">${e.action}</div>
                <div class="timeline-detail">${e.detail}</div>
            </div>
        </div>
    `).join('');
}

function renderCrew() {
    const crew = flightData.crew;
    const reserveCrew = flightData.reserveCrew;
    
    document.getElementById('content-crew').innerHTML = `
        <div class="section-title">👨‍✈️ Crew Management</div>
