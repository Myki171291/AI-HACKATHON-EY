<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyMarshal Flight Recovery Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a1628; color: #e0e6ed; }
        .header { background: linear-gradient(135deg, #1a2744, #0d1a2d); padding: 20px; border-bottom: 2px solid #2d4a6f; }
        .header h1 { font-size: 24px; color: #4fc3f7; }
        .filters { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; align-items: center; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 11px; color: #81d4fa; text-transform: uppercase; }
        .filter-group select, .filter-group input { padding: 10px; border-radius: 6px; border: 1px solid #2d4a6f; background: #1a2744; color: #e0e6ed; min-width: 180px; }
        .btn { padding: 10px 20px; background: #00897b; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 18px; }
        .btn:hover { background: #00695c; }
        .main { padding: 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .flight-info { background: linear-gradient(135deg, #1a2744, #152238); border-radius: 10px; padding: 20px; border: 1px solid #2d4a6f; }
        .flight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .flight-number { font-size: 28px; font-weight: 700; color: #4fc3f7; }
        .flight-status { padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-delayed { background: rgba(255,183,77,0.2); color: #ffb74d; }
        .status-cancelled { background: rgba(239,83,80,0.2); color: #ef5350; }
        .status-ontime { background: rgba(102,187,106,0.2); color: #66bb6a; }
        .flight-route { display: flex; align-items: center; gap: 20px; margin: 20px 0; }
        .airport { text-align: center; }
        .airport-code { font-size: 24px; font-weight: 700; }
        .airport-time { font-size: 14px; color: #81d4fa; }
        .route-line { flex: 1; height: 2px; background: #2d4a6f; position: relative; }
        .route-line::after { content: "✈"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); color: #4fc3f7; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-item { background: #0d1a2d; padding: 12px; border-radius: 8px; }
        .info-label { font-size: 11px; color: #81d4fa; text-transform: uppercase; }
        .info-value { font-size: 16px; font-weight: 600; margin-top: 5px; }
        .passengers-section { background: linear-gradient(135deg, #1a2744, #152238); border-radius: 10px; border: 1px solid #2d4a6f; }
        .section-header { padding: 15px 20px; background: #2d4a6f; font-weight: 600; display: flex; justify-content: space-between; border-radius: 10px 10px 0 0; }
        .pax-list { max-height: 500px; overflow-y: auto; }
        .pax-item { padding: 15px 20px; border-bottom: 1px solid #2d4a6f; cursor: pointer; transition: background 0.2s; }
        .pax-item:hover { background: rgba(79,195,247,0.1); }
        .pax-item.selected { background: rgba(79,195,247,0.2); border-left: 3px solid #4fc3f7; }
        .pax-name { font-weight: 600; }
        .pax-details { font-size: 12px; color: #81d4fa; margin-top: 5px; }
        .pax-status { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 10px; margin-top: 5px; }
        .pax-disrupted { background: rgba(239,83,80,0.2); color: #ef5350; }
        .pax-rebooked { background: rgba(102,187,106,0.2); color: #66bb6a; }
        .pax-pending { background: rgba(255,183,77,0.2); color: #ffb74d; }
        .detail-panel { grid-column: 1 / -1; background: linear-gradient(135deg, #1a2744, #152238); border-radius: 10px; border: 1px solid #4fc3f7; padding: 20px; display: none; }
        .detail-panel.active { display: block; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-title { font-size: 20px; font-weight: 600; color: #4fc3f7; }
        .close-btn { background: none; border: none; color: #81d4fa; font-size: 24px; cursor: pointer; }
        .timeline { margin-top: 20px; }
        .timeline-item { display: flex; gap: 15px; padding: 15px 0; border-left: 2px solid #2d4a6f; margin-left: 10px; padding-left: 20px; position: relative; }
        .timeline-item::before { content: ""; width: 12px; height: 12px; background: #4fc3f7; border-radius: 50%; position: absolute; left: -7px; }
        .timeline-time { font-size: 12px; color: #81d4fa; min-width: 100px; }
        .timeline-content { flex: 1; }
        .timeline-action { font-weight: 600; }
        .timeline-detail { font-size: 13px; color: #b0bec5; margin-top: 5px; }
        .special-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .tag { padding: 3px 8px; border-radius: 4px; font-size: 10px; background: rgba(79,195,247,0.2); color: #4fc3f7; }
        .tag.wheelchair { background: rgba(156,39,176,0.2); color: #ce93d8; }
        .tag.um { background: rgba(255,152,0,0.2); color: #ffb74d; }
        .tag.ffp { background: rgba(255,215,0,0.2); color: #ffd700; }
    </style>
</head>
<body>
<div class="header">
    <h1>✈ SkyMarshal Flight Recovery Dashboard</h1>
    <div class="filters">
        <div class="filter-group">
            <label>Date</label>
            <select id="dateSelect"></select>
        </div>
        <div class="filter-group">
            <label>Flight Number</label>
            <select id="flightSelect"></select>
        </div>
        <button class="btn" onclick="loadFlightData()">Load Flight</button>
    </div>
</div>
<div class="main">
    <div class="flight-info" id="flightInfo">
        <div style="text-align:center;color:#81d4fa;padding:50px;">Select a date and flight to view details</div>
    </div>
    <div class="passengers-section">
        <div class="section-header">
            <span>Passengers</span>
            <span id="paxCount">0 passengers</span>
        </div>
        <div class="pax-list" id="paxList">
            <div style="text-align:center;color:#81d4fa;padding:50px;">No flight selected</div>
        </div>
    </div>
    <div class="detail-panel" id="detailPanel"></div>
</div>
<script src="data.js"></script>
<script>
// Global state
let selectedFlight = null;
let selectedPassenger = null;

// Initialize on load
document.addEventListener('DOMContentLoaded', () => {
    populateDates();
});

// Get unique dates from flights
function populateDates() {
    const dates = [...new Set(DASHBOARD_DATA.flights_scenarios.map(f => {
        const d = new Date(f.scheduled_departure);
        return d.toISOString().split('T')[0];
    }))].sort();
    
    const dateSelect = document.getElementById('dateSelect');
    dateSelect.innerHTML = '<option value="">Select Date</option>';
    dates.forEach(date => {
        const opt = document.createElement('option');
        opt.value = date;
        opt.textContent = formatDate(date);
        dateSelect.appendChild(opt);
    });
    
    dateSelect.addEventListener('change', populateFlights);
}

// Format date for display
function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

// Populate flights for selected date
function populateFlights() {
    const date = document.getElementById('dateSelect').value;
    const flightSelect = document.getElementById('flightSelect');
    flightSelect.innerHTML = '<option value="">Select Flight</option>';
    
    if (!date) return;
    
    const flights = DASHBOARD_DATA.flights_scenarios.filter(f => {
        const d = new Date(f.scheduled_departure);
        return d.toISOString().split('T')[0] === date;
    }).sort((a, b) => new Date(a.scheduled_departure) - new Date(b.scheduled_departure));
    
    flights.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.flight_id;
        const time = new Date(f.scheduled_departure).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const status = f.flight_status === 'Delayed' ? ' ⚠️' : f.flight_status === 'Cancelled' ? ' ❌' : '';
        opt.textContent = `${f.flight_number} - ${f.origin_code}→${f.destination_code} (${time})${status}`;
        flightSelect.appendChild(opt);
    });
}

// Load flight data
function loadFlightData() {
    const flightId = document.getElementById('flightSelect').value;
    if (!flightId) {
        alert('Please select a flight');
        return;
    }
    
    selectedFlight = DASHBOARD_DATA.flights_scenarios.find(f => f.flight_id === flightId);
    if (!selectedFlight) return;
    
    renderFlightInfo();
    renderPassengers();
    closeDetailPanel();
}

// Render flight information
function renderFlightInfo() {
    const f = selectedFlight;
    const statusClass = f.flight_status === 'Delayed' ? 'status-delayed' : 
                        f.flight_status === 'Cancelled' ? 'status-cancelled' : 'status-ontime';
    
    const depTime = new Date(f.scheduled_departure).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const arrTime = new Date(f.scheduled_arrival).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const actualArr = new Date(f.arrival_time).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    
    document.getElementById('flightInfo').innerHTML = `
        <div class="flight-header">
            <span class="flight-number">${f.flight_number}</span>
            <span class="flight-status ${statusClass}">${f.flight_status}${f.delay_minutes > 0 ? ' (+' + f.delay_minutes + 'min)' : ''}</span>
        </div>
        <div class="flight-route">
            <div class="airport">
                <div class="airport-code">${f.origin_code}</div>
                <div class="airport-time">${depTime}</div>
            </div>
            <div class="route-line"></div>
            <div class="airport">
                <div class="airport-code">${f.destination_code}</div>
                <div class="airport-time">${arrTime}${f.delay_minutes > 0 ? ' → ' + actualArr : ''}</div>
            </div>
        </div>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Aircraft</div>
                <div class="info-value">${f.aircraft_registration} (${f.aircraft_code})</div>
            </div>
            <div class="info-item">
                <div class="info-label">Gate / Terminal</div>
                <div class="info-value">${f.gate} / T${f.terminal}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Scenario</div>
                <div class="info-value" style="font-size:12px;">${f.scenario_name}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Disruption</div>
                <div class="info-value" style="font-size:12px;">${f.disruption_reason || 'None'}</div>
            </div>
            ${f.mel_status === 'ACTIVE' ? `
            <div class="info-item" style="grid-column: 1/-1; background: rgba(255,183,77,0.1);">
                <div class="info-label" style="color:#ffb74d;">MEL Status</div>
                <div class="info-value" style="color:#ffb74d;">${f.mel_item} - Cat ${f.mel_category} (${f.mel_days_remaining} days remaining) - ${f.mel_restrictions}</div>
            </div>` : ''}
        </div>
    `;
}

// Render passengers list
function renderPassengers() {
    const passengers = DASHBOARD_DATA.passengers_enriched_final.filter(p => p.flight_id === selectedFlight.flight_id);
    
    document.getElementById('paxCount').textContent = `${passengers.length} passengers`;
    
    if (passengers.length === 0) {
        document.getElementById('paxList').innerHTML = '<div style="text-align:center;color:#81d4fa;padding:50px;">No passengers on this flight</div>';
        return;
    }
    
    const paxHtml = passengers.map(p => {
        const isDisrupted = p.disruption_status && p.disruption_status !== 'None' && p.disruption_status !== '';
        const isRebooked = p.rebooking_status === 'Rebooked' || p.rebooking_status === 'Confirmed';
        const statusClass = isRebooked ? 'pax-rebooked' : isDisrupted ? 'pax-disrupted' : 'pax-pending';
        const statusText = isRebooked ? 'Rebooked' : isDisrupted ? 'Disrupted' : 'OK';
        
        const tags = [];
        if (p.wheelchair_required === 'Y' || p.wheelchair_required === true) tags.push('<span class="tag wheelchair">WCHR</span>');
        if (p.unaccompanied_minor === 'Y' || p.unaccompanied_minor === true) tags.push('<span class="tag um">UM</span>');
        if (p.frequent_flyer_tier && p.frequent_flyer_tier !== '' && p.frequent_flyer_tier !== 'None') tags.push(`<span class="tag ffp">${p.frequent_flyer_tier}</span>`);
        if (p.special_meal && p.special_meal !== '' && p.special_meal !== 'None') tags.push(`<span class="tag">${p.special_meal}</span>`);
        
        return `
            <div class="pax-item" onclick="showPassengerDetail('${p.passenger_id}')">
                <div class="pax-name">${p.first_name} ${p.last_name}</div>
                <div class="pax-details">
                    ${p.booking_reference || p.booking_id} | Seat: ${p.seat_number || 'TBA'} | ${p.cabin_class || 'Economy'}
                </div>
                <span class="pax-status ${statusClass}">${statusText}</span>
                ${tags.length > 0 ? `<div class="special-tags">${tags.join('')}</div>` : ''}
            </div>
        `;
    }).join('');
    
    document.getElementById('paxList').innerHTML = paxHtml;
}

// Show passenger detail with recovery timeline
function showPassengerDetail(passengerId) {
    selectedPassenger = DASHBOARD_DATA.passengers_enriched_final.find(p => p.passenger_id === passengerId);
    if (!selectedPassenger) return;
    
    // Highlight selected passenger
    document.querySelectorAll('.pax-item').forEach(el => el.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
    
    const p = selectedPassenger;
    const booking = DASHBOARD_DATA.bookings?.find(b => b.booking_id === p.booking_id || b.booking_reference === p.booking_reference);
    const rebooking = DASHBOARD_DATA.oal_rebooking_options?.find(r => r.passenger_id === p.passenger_id || r.booking_id === p.booking_id);
    
    // Build timeline
    const timeline = buildRecoveryTimeline(p, booking, rebooking);
    
    const panel = document.getElementById('detailPanel');
    panel.innerHTML = `
        <div class="detail-header">
            <div class="detail-title">👤 ${p.first_name} ${p.last_name}</div>
            <button class="close-btn" onclick="closeDetailPanel()">×</button>
        </div>
        <div class="info-grid" style="grid-template-columns: repeat(4, 1fr);">
            <div class="info-item">
                <div class="info-label">Passenger ID</div>
                <div class="info-value">${p.passenger_id}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Booking Ref</div>
                <div class="info-value">${p.booking_reference || p.booking_id}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Seat</div>
                <div class="info-value">${p.seat_number || 'TBA'}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Class</div>
                <div class="info-value">${p.cabin_class || 'Economy'}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Contact</div>
                <div class="info-value" style="font-size:12px;">${p.email || 'N/A'}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Phone</div>
                <div class="info-value">${p.phone || 'N/A'}</div>
            </div>
            <div class="info-item">
                <div class="info-label">FFP Tier</div>
                <div class="info-value">${p.frequent_flyer_tier || 'None'}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Nationality</div>
                <div class="info-value">${p.nationality || 'N/A'}</div>
            </div>
        </div>
        ${p.connecting_flight ? `
        <div class="info-item" style="margin-top:15px; background: rgba(79,195,247,0.1);">
            <div class="info-label">Connecting Flight</div>
            <div class="info-value">${p.connecting_flight} to ${p.final_destination || 'N/A'}</div>
        </div>` : ''}
        <div class="timeline">
            <h3 style="color:#4fc3f7; margin-bottom:15px;">Recovery Timeline</h3>
            ${timeline}
        </div>
    `;
    panel.classList.add('active');
}

// Build recovery timeline based on passenger data
function buildRecoveryTimeline(p, booking, rebooking) {
    const events = [];
    const flight = selectedFlight;
    
    // Original booking
    events.push({
        time: 'Original',
        action: 'Booked on ' + flight.flight_number,
        detail: `${flight.origin_code} → ${flight.destination_code}, Scheduled: ${new Date(flight.scheduled_departure).toLocaleString()}`
    });
    
    // Disruption detected
    if (flight.delay_minutes > 0 || flight.flight_status === 'Cancelled' || flight.flight_status === 'Delayed') {
        events.push({
            time: 'Disruption',
            action: flight.flight_status === 'Cancelled' ? 'Flight Cancelled' : `Flight Delayed ${flight.delay_minutes} min`,
            detail: flight.disruption_reason || 'Operational disruption'
        });
    }
    
    // Notification
    if (p.notification_sent === 'Y' || p.notification_sent === true || p.sms_sent === 'Y') {
        events.push({
            time: 'Notified',
            action: 'Passenger Notified',
            detail: `Via ${p.notification_channel || 'SMS/Email'}`
        });
    }
    
    // Rebooking action
    if (p.rebooking_status && p.rebooking_status !== 'None' && p.rebooking_status !== '') {
        const rebookDetail = rebooking ? 
            `New flight: ${rebooking.new_flight_number || rebooking.alternative_flight || 'TBD'}` : 
            (p.new_flight_number ? `New flight: ${p.new_flight_number}` : 'Processing rebooking options');
        events.push({
            time: 'Rebooking',
            action: p.rebooking_status,
            detail: rebookDetail
        });
    }
    
    // Compensation
    if (p.compensation_offered === 'Y' || p.compensation_amount > 0 || p.voucher_issued === 'Y') {
        events.push({
            time: 'Compensation',
            action: 'Compensation Offered',
            detail: p.compensation_amount ? `Amount: $${p.compensation_amount}` : 'Voucher/Miles credited'
        });
    }
    
    // Hotel accommodation
    if (p.hotel_booked === 'Y' || p.accommodation_provided === 'Y') {
        events.push({
            time: 'Accommodation',
            action: 'Hotel Arranged',
            detail: p.hotel_name || 'Airport hotel booked'
        });
    }
    
    // Meal voucher
    if (p.meal_voucher === 'Y' || p.meal_provided === 'Y') {
        events.push({
            time: 'Meals',
            action: 'Meal Voucher Issued',
            detail: 'Airport dining voucher provided'
        });
    }
    
    // Final status
    const finalStatus = p.rebooking_status === 'Rebooked' || p.rebooking_status === 'Confirmed' ? 
        'Passenger successfully rebooked' : 
        (flight.delay_minutes > 0 ? 'Awaiting updated departure' : 'Ready for departure');
    events.push({
        time: 'Current',
        action: 'Status',
        detail: finalStatus
    });
    
    return events.map(e => `
        <div class="timeline-item">
            <div class="timeline-time">${e.time}</div>
            <div class="timeline-content">
                <div class="timeline-action">${e.action}</div>
                <div class="timeline-detail">${e.detail}</div>
            </div>
        </div>
    `).join('');
}

// Close detail panel
function closeDetailPanel() {
    document.getElementById('detailPanel').classList.remove('active');
    document.querySelectorAll('.pax-item').forEach(el => el.classList.remove('selected'));
    selectedPassenger = null;
}
</script>
</body>
</html>
