<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyMarshal Multi-Agent Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a1628; color: #e0e6ed; }
        .header { background: linear-gradient(135deg, #1a2744 0%, #0d1a2d 100%); padding: 20px; border-bottom: 2px solid #2d4a6f; }
        .header h1 { font-size: 28px; color: #4fc3f7; display: flex; align-items: center; gap: 10px; }
        .header h1::before { content: "✈"; font-size: 32px; }
        .scenario-selector { display: flex; align-items: center; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .scenario-selector label { font-weight: 600; color: #81d4fa; }
        .scenario-selector select { padding: 10px 20px; font-size: 14px; border-radius: 8px; border: 1px solid #2d4a6f; background: #1a2744; color: #e0e6ed; cursor: pointer; min-width: 300px; }
        .scenario-selector select:focus { outline: none; border-color: #4fc3f7; }
        .refresh-btn { padding: 10px 25px; background: linear-gradient(135deg, #00897b 0%, #00695c 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,137,123,0.4); }
        .main-content { padding: 20px; }
        .global-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .metric-card { background: linear-gradient(135deg, #1a2744 0%, #152238 100%); padding: 20px; border-radius: 12px; border: 1px solid #2d4a6f; text-align: center; transition: all 0.3s; }
        .metric-card:hover { transform: translateY(-3px); border-color: #4fc3f7; }
        .metric-value { font-size: 32px; font-weight: 700; color: #4fc3f7; }
        .metric-label { font-size: 12px; color: #81d4fa; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .metric-card.critical .metric-value { color: #ef5350; }
        .metric-card.warning .metric-value { color: #ffb74d; }
        .metric-card.success .metric-value { color: #66bb6a; }
        .agents-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .bottom-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .agent-panel { background: linear-gradient(135deg, #1a2744 0%, #152238 100%); border-radius: 12px; border: 1px solid #2d4a6f; overflow: hidden; }
        .agent-header { padding: 15px 20px; background: linear-gradient(135deg, #2d4a6f 0%, #1a3a5c 100%); display: flex; align-items: center; gap: 12px; }
        .agent-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .agent-title { font-size: 16px; font-weight: 600; }
        .agent-status { margin-left: auto; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-active { background: rgba(102,187,106,0.2); color: #66bb6a; }
        .status-warning { background: rgba(255,183,77,0.2); color: #ffb74d; }
        .status-critical { background: rgba(239,83,80,0.2); color: #ef5350; }
</style>
</head>
<body>
    <div class="header">
        <h1>SkyMarshal Disruption Recovery Dashboard</h1>
        <div class="scenario-selector">
            <label>Select Scenario:</label>
            <select id="scenarioSelect"></select>
            <button class="refresh-btn" onclick="loadScenarioData()">Refresh Data</button>
            <span id="lastUpdate" style="color: #81d4fa; font-size: 12px;"></span>
        </div>
    </div>
    <div class="main-content">
        <div class="global-metrics" id="globalMetrics"></div>
        <div class="agents-grid" id="agentsGrid"></div>
        <div class="bottom-section">
            <div class="risks-panel" id="risksPanel"></div>
            <div class="actions-panel" id="actionsPanel"></div>
        </div>
    </div>
</body>
</html>

<script>
// Scenario definitions
const SCENARIOS = {
    1: { name: 'Bangkok Typhoon + Critical MEL Aircraft', date: '2026-01-19' },
    2: { name: 'London Fog + Multiple Aircraft AOG', date: '2026-01-20' },
    3: { name: 'Singapore Thunderstorms + MEL Expiry', date: '2026-01-21' },
    4: { name: 'Paris Winter Storm + Cargo Crisis', date: '2026-01-22' },
    5: { name: 'Dubai Sandstorm + Hub Congestion', date: '2026-01-23' },
    6: { name: 'Multiple Aircraft AOG + Engine Failure', date: '2026-01-24' },
    7: { name: 'Crew Out of Hours + Cabin Crew Crisis', date: '2026-01-25' },
    8: { name: 'Runway Closure + Airspace Restrictions', date: '2026-01-27' },
    9: { name: 'Security Threat + Airspace Diversion', date: '2026-01-28' },
    10: { name: 'Medical Emergency + Tarmac Delay', date: '2026-01-29' },
    11: { name: 'EY401 Typhoon to EY406 LIAC', date: '2026-01-31' }
};

// Agent configurations
const AGENTS = {
    flight_ops: { name: 'Flight Operations', icon: '✈️', color: '#4fc3f7' },
    passenger: { name: 'Passenger Services', icon: '👥', color: '#ba68c8' },
    crew: { name: 'Crew Management', icon: '👨‍✈️', color: '#ffb74d' },
    maintenance: { name: 'Maintenance', icon: '🔧', color: '#ef5350' },
    cargo: { name: 'Cargo', icon: '📦', color: '#66bb6a' },
    recovery: { name: 'Recovery Planning', icon: '📊', color: '#42a5f5' },
    safety: { name: 'Safety & Compliance', icon: '🛡️', color: '#ff7043' }
};

// Data storage
let allData = {};
let currentScenario = 1;

// Initialize scenario selector
function initScenarioSelector() {
    const select = document.getElementById('scenarioSelect');
    for (let id in SCENARIOS) {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `Scenario ${id}: ${SCENARIOS[id].name} (${SCENARIOS[id].date})`;
        select.appendChild(opt);
    }
    select.addEventListener('change', (e) => {
        currentScenario = parseInt(e.target.value);
        updateDashboard();
    });
}

// Load CSV data
async function loadCSV(filename) {
    return new Promise((resolve, reject) => {
        Papa.parse(`../${filename}`, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: (results) => resolve(results.data),
            error: (err) => reject(err)
        });
    });
}

// Load all data
async function loadScenarioData() {
    document.getElementById('lastUpdate').textContent = 'Loading...';
    try {
        allData.flights = await loadCSV('flights_enriched_scenarios.csv');
        allData.passengers = await loadCSV('passengers_enriched_final.csv');
        allData.bookings = await loadCSV('bookings.csv');
        allData.crew = await loadCSV('crew_roster_enriched.csv');
        allData.reserve_crew = await loadCSV('reserve_crew_pool.csv');
        allData.maintenance = await loadCSV('aircraft_maintenance_workorders.csv');
        allData.aircraft = await loadCSV('aircraft_availability_enriched_mel.csv');
        allData.cargo = await loadCSV('cargo_shipments.csv');
        allData.recovery = await loadCSV('recovery_scenarios.csv');
        allData.disruptions = await loadCSV('disruption_events.csv');
        allData.financial = await loadCSV('financial_impact.csv');
        allData.safety = await loadCSV('safety_constraints.csv');
        allData.weather = await loadCSV('weather.csv');
        allData.oal = await loadCSV('oal_rebooking_options.csv');
        allData.swap = await loadCSV('aircraft_swap_options.csv');
        
        document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        updateDashboard();
    } catch (err) {
        console.error('Error loading data:', err);
        document.getElementById('lastUpdate').textContent = 'Error loading data';
    }
}
</script>

<script>
// Filter data by scenario
function filterByScenario(data, scenarioId) {
    return data.filter(row => row.scenario_id === scenarioId);
}

// Calculate global metrics
function calculateGlobalMetrics(scenarioId) {
    const flights = filterByScenario(allData.flights, scenarioId);
    const passengers = filterByScenario(allData.passengers, scenarioId);
    const crew = filterByScenario(allData.crew, scenarioId);
    const cargo = filterByScenario(allData.cargo, scenarioId);
    const financial = filterByScenario(allData.financial, scenarioId)[0] || {};
    const disruption = filterByScenario(allData.disruptions, scenarioId)[0] || {};
    
    const delayedFlights = flights.filter(f => f.delay_minutes > 0).length;
    const cancelledFlights = flights.filter(f => f.flight_status === 'CANCELLED').length;
    const avgDelay = flights.length > 0 ? Math.round(flights.reduce((sum, f) => sum + (f.delay_minutes || 0), 0) / flights.length) : 0;
    const affectedPax = passengers.filter(p => p.is_disrupted === true || p.is_disrupted === 'True').length;
    
    return {
        totalFlights: flights.length,
        delayedFlights,
        cancelledFlights,
        avgDelay,
        totalPassengers: passengers.length,
        affectedPassengers: affectedPax,
        totalCrew: crew.length,
        totalCargo: cargo.length,
        totalCost: financial.total_cost_usd || 0,
        severity: disruption.severity || 'Unknown'
    };
}

// Render global metrics
function renderGlobalMetrics(metrics) {
    const container = document.getElementById('globalMetrics');
    container.innerHTML = `
        <div class="metric-card ${metrics.delayedFlights > 5 ? 'warning' : ''}">
            <div class="metric-value">${metrics.totalFlights}</div>
            <div class="metric-label">Total Flights</div>
        </div>
        <div class="metric-card ${metrics.delayedFlights > 5 ? 'critical' : 'warning'}">
            <div class="metric-value">${metrics.delayedFlights}</div>
            <div class="metric-label">Delayed Flights</div>
        </div>
        <div class="metric-card ${metrics.cancelledFlights > 0 ? 'critical' : ''}">
            <div class="metric-value">${metrics.cancelledFlights}</div>
            <div class="metric-label">Cancelled</div>
        </div>
        <div class="metric-card ${metrics.avgDelay > 60 ? 'critical' : metrics.avgDelay > 30 ? 'warning' : ''}">
            <div class="metric-value">${metrics.avgDelay}m</div>
            <div class="metric-label">Avg Delay</div>
        </div>
        <div class="metric-card">
            <div class="metric-value">${metrics.totalPassengers.toLocaleString()}</div>
            <div class="metric-label">Passengers</div>
        </div>
        <div class="metric-card ${metrics.affectedPassengers > 100 ? 'critical' : 'warning'}">
            <div class="metric-value">${metrics.affectedPassengers.toLocaleString()}</div>
            <div class="metric-label">Affected Pax</div>
        </div>
        <div class="metric-card">
            <div class="metric-value">${metrics.totalCrew}</div>
            <div class="metric-label">Crew Assigned</div>
        </div>
        <div class="metric-card ${metrics.totalCost > 100000 ? 'critical' : 'warning'}">
            <div class="metric-value">$${(metrics.totalCost/1000).toFixed(0)}K</div>
            <div class="metric-label">Est. Cost</div>
        </div>
    `;
}

// Calculate agent-specific KPIs
function calculateAgentKPIs(scenarioId) {
    const flights = filterByScenario(allData.flights, scenarioId);
    const passengers = filterByScenario(allData.passengers, scenarioId);
    const bookings = filterByScenario(allData.bookings, scenarioId);
    const crew = filterByScenario(allData.crew, scenarioId);
    const reserve = filterByScenario(allData.reserve_crew, scenarioId);
    const maintenance = filterByScenario(allData.maintenance, scenarioId);
    const aircraft = filterByScenario(allData.aircraft, scenarioId);
    const cargo = filterByScenario(allData.cargo, scenarioId);
    const recovery = filterByScenario(allData.recovery, scenarioId);
    const safety = filterByScenario(allData.safety, scenarioId);
    const oal = filterByScenario(allData.oal, scenarioId);
    const swap = filterByScenario(allData.swap, scenarioId);
    const weather = filterByScenario(allData.weather, scenarioId);
    
    return {
        flight_ops: {
            status: flights.filter(f => f.flight_status === 'CANCELLED').length > 2 ? 'critical' : 'active',
            kpis: [
                { label: 'On-Time', value: flights.filter(f => f.delay_minutes === 0).length, total: flights.length },
                { label: 'Delayed', value: flights.filter(f => f.delay_minutes > 0).length },
                { label: 'Cancelled', value: flights.filter(f => f.flight_status === 'CANCELLED').length },
                { label: 'Swap Options', value: swap.length }
            ],
            risks: weather.filter(w => w.severity === 'SEVERE').map(w => `${w.weather_type} at ${w.airport_code}`),
            actions: swap.length > 0 ? [`${swap.length} aircraft swap options available`] : ['No swap options']
        },
        passenger: {
            status: passengers.filter(p => p.is_disrupted).length > 500 ? 'critical' : 'warning',
            kpis: [
                { label: 'Total Pax', value: passengers.length },
                { label: 'Disrupted', value: passengers.filter(p => p.is_disrupted === true || p.is_disrupted === 'True').length },
                { label: 'Rebooked', value: passengers.filter(p => p.rebook_status === 'CONFIRMED').length },
                { label: 'OAL Options', value: oal.length }
            ],
            risks: passengers.filter(p => p.requires_wheelchair || p.is_unaccompanied_minor).length > 0 ? ['Special assistance passengers affected'] : [],
            actions: oal.length > 0 ? [`${oal.length} OAL rebooking options`] : []
        },
        crew: {
            status: crew.filter(c => c.duty_hours_remaining < 2).length > 5 ? 'critical' : 'active',
            kpis: [
                { label: 'Assigned', value: crew.length },
                { label: 'Available', value: crew.filter(c => c.roster_status === 'AVAILABLE').length },
                { label: 'Reserve', value: reserve.length },
                { label: 'Near Limit', value: crew.filter(c => c.duty_hours_remaining < 2).length }
            ],
            risks: crew.filter(c => c.duty_hours_remaining < 1).length > 0 ? ['Crew approaching duty limits'] : [],
            actions: reserve.length > 0 ? [`${reserve.length} reserve crew available`] : []
        },
        maintenance: {
            status: aircraft.filter(a => a.status === 'AOG').length > 0 ? 'critical' : 'active',
            kpis: [
                { label: 'Work Orders', value: maintenance.length },
                { label: 'AOG Aircraft', value: aircraft.filter(a => a.status === 'AOG').length },
                { label: 'MEL Items', value: aircraft.filter(a => a.mel_category).length },
                { label: 'Available', value: aircraft.filter(a => a.status === 'AVAILABLE').length }
            ],
            risks: aircraft.filter(a => a.status === 'AOG').map(a => `${a.aircraft_registration} is AOG`),
            actions: maintenance.filter(m => m.priority === 'HIGH').length > 0 ? ['High priority maintenance pending'] : []
        },
        cargo: {
            status: cargo.filter(c => c.is_dangerous_goods).length > 0 ? 'warning' : 'active',
            kpis: [
                { label: 'Shipments', value: cargo.length },
                { label: 'DG Goods', value: cargo.filter(c => c.is_dangerous_goods === true || c.is_dangerous_goods === 'True').length },
                { label: 'Temp Sensitive', value: cargo.filter(c => c.is_temperature_sensitive === true || c.is_temperature_sensitive === 'True').length },
                { label: 'Priority', value: cargo.filter(c => c.priority === 'HIGH' || c.priority === 'CRITICAL').length }
            ],
            risks: cargo.filter(c => c.is_dangerous_goods).length > 0 ? ['Dangerous goods require special handling'] : [],
            actions: []
        },
        recovery: {
            status: recovery.filter(r => r.status === 'IN_PROGRESS').length > 0 ? 'active' : 'warning',
            kpis: [
                { label: 'Plans', value: recovery.length },
                { label: 'In Progress', value: recovery.filter(r => r.status === 'IN_PROGRESS').length },
                { label: 'Completed', value: recovery.filter(r => r.status === 'COMPLETED').length },
                { label: 'Pending', value: recovery.filter(r => r.status === 'PENDING').length }
            ],
            risks: [],
            actions: recovery.filter(r => r.priority === 'HIGH').map(r => r.action_type || 'Recovery action')
        },
        safety: {
            status: safety.filter(s => s.is_violated === true || s.is_violated === 'True').length > 0 ? 'critical' : 'active',
            kpis: [
                { label: 'Constraints', value: safety.length },
                { label: 'Active', value: safety.filter(s => s.is_active === true || s.is_active === 'True').length },
                { label: 'Violations', value: safety.filter(s => s.is_violated === true || s.is_violated === 'True').length },
                { label: 'Warnings', value: safety.filter(s => s.severity === 'WARNING').length }
            ],
            risks: safety.filter(s => s.is_violated).map(s => `${s.constraint_type} violation`),
            actions: []
        }
    };
}
</script>

<script>
// Render agent panels
function renderAgentPanels(agentKPIs) {
    const container = document.getElementById('agentsGrid');
    container.innerHTML = '';
    
    for (let agentId in AGENTS) {
        const agent = AGENTS[agentId];
        const data = agentKPIs[agentId];
        const statusClass = data.status === 'critical' ? 'status-critical' : data.status === 'warning' ? 'status-warning' : 'status-active';
        
        const panel = document.createElement('div');
        panel.className = 'agent-panel';
        panel.innerHTML = `
            <div class="agent-header">
                <div class="agent-icon" style="background: ${agent.color}20; color: ${agent.color}">${agent.icon}</div>
                <div class="agent-title">${agent.name}</div>
                <span class="agent-status ${statusClass}">${data.status.toUpperCase()}</span>
            </div>
            <div class="agent-content" style="padding: 15px;">
                <div class="agent-kpis" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
                    ${data.kpis.map(kpi => `
                        <div style="background: #0d1a2d; padding: 12px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 24px; font-weight: 700; color: ${agent.color}">${kpi.value}</div>
                            <div style="font-size: 11px; color: #81d4fa; text-transform: uppercase;">${kpi.label}</div>
                        </div>
                    `).join('')}
                </div>
                ${data.risks.length > 0 ? `
                    <div style="background: rgba(239,83,80,0.1); border: 1px solid #ef5350; border-radius: 8px; padding: 10px; margin-bottom: 10px;">
                        <div style="font-size: 11px; color: #ef5350; font-weight: 600; margin-bottom: 5px;">⚠️ RISKS</div>
                        ${data.risks.slice(0, 2).map(r => `<div style="font-size: 12px; color: #ffcdd2;">• ${r}</div>`).join('')}
                    </div>
                ` : ''}
                ${data.actions.length > 0 ? `
                    <div style="background: rgba(102,187,106,0.1); border: 1px solid #66bb6a; border-radius: 8px; padding: 10px;">
                        <div style="font-size: 11px; color: #66bb6a; font-weight: 600; margin-bottom: 5px;">✓ ACTIONS</div>
                        ${data.actions.slice(0, 2).map(a => `<div style="font-size: 12px; color: #c8e6c9;">• ${a}</div>`).join('')}
                    </div>
                ` : ''}
            </div>
        `;
        container.appendChild(panel);
    }
}

// Render risks and actions panels
function renderBottomPanels(agentKPIs) {
    const risksPanel = document.getElementById('risksPanel');
    const actionsPanel = document.getElementById('actionsPanel');
    
    // Collect all risks
    let allRisks = [];
    let allActions = [];
    for (let agentId in agentKPIs) {
        const data = agentKPIs[agentId];
        data.risks.forEach(r => allRisks.push({ agent: AGENTS[agentId].name, risk: r, icon: AGENTS[agentId].icon }));
        data.actions.forEach(a => allActions.push({ agent: AGENTS[agentId].name, action: a, icon: AGENTS[agentId].icon }));
    }
    
    risksPanel.innerHTML = `
        <div style="background: linear-gradient(135deg, #1a2744 0%, #152238 100%); border-radius: 12px; border: 1px solid #ef5350; padding: 20px; margin-bottom: 20px;">
            <h3 style="color: #ef5350; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <span>⚠️</span> Top Risks (${allRisks.length})
            </h3>
            ${allRisks.length > 0 ? allRisks.slice(0, 5).map(r => `
                <div style="display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(239,83,80,0.1); border-radius: 8px; margin-bottom: 8px;">
                    <span style="font-size: 20px;">${r.icon}</span>
                    <div>
                        <div style="font-size: 12px; color: #81d4fa;">${r.agent}</div>
                        <div style="font-size: 14px; color: #ffcdd2;">${r.risk}</div>
                    </div>
                </div>
            `).join('') : '<div style="color: #66bb6a;">No critical risks identified</div>'}
        </div>
    `;
    
    actionsPanel.innerHTML = `
        <div style="background: linear-gradient(135deg, #1a2744 0%, #152238 100%); border-radius: 12px; border: 1px solid #66bb6a; padding: 20px;">
            <h3 style="color: #66bb6a; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <span>✓</span> Recommended Actions (${allActions.length})
            </h3>
            ${allActions.length > 0 ? allActions.slice(0, 5).map(a => `
                <div style="display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(102,187,106,0.1); border-radius: 8px; margin-bottom: 8px;">
                    <span style="font-size: 20px;">${a.icon}</span>
                    <div>
                        <div style="font-size: 12px; color: #81d4fa;">${a.agent}</div>
                        <div style="font-size: 14px; color: #c8e6c9;">${a.action}</div>
                    </div>
                </div>
            `).join('') : '<div style="color: #81d4fa;">No pending actions</div>'}
        </div>
    `;
}

// Update dashboard
function updateDashboard() {
    if (!allData.flights) return;
    
    const metrics = calculateGlobalMetrics(currentScenario);
    renderGlobalMetrics(metrics);
    
    const agentKPIs = calculateAgentKPIs(currentScenario);
    renderAgentPanels(agentKPIs);
    renderBottomPanels(agentKPIs);
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    initScenarioSelector();
    loadScenarioData();
});
</script>
